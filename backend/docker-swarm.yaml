version: "3.9"

services:
  currency-converter:
    image: currency.converter:latest
    build:
      context: .
      dockerfile: CurrencyConverter/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8079
    networks:
      - app-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    expose:
      - "8079"

  currency-converter-history:
    image: currency.converter.history:latest
    build:
      context: .
      dockerfile: CurrencyConverter.History/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    expose:
      - "8080"

  nginx:
    image: nginx:latest
    ports:
      - "4999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - currency.converter
      - currency.converter.history
    networks:
      - app-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M

networks:
  app-net:
    driver: overlay
